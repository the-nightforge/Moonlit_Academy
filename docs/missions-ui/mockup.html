<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vòng Nguyệt · Đề xuất màn hình nhiệm vụ</title>
<style>
:root{color-scheme:dark;--ink:#edf0f9;--muted:#b1bad2;--line:#455474;--gold:#edce89;--panel:#151e32;--green:#acdabf}*{box-sizing:border-box}body{margin:0;background:#080e1b;color:var(--ink);font:16px/1.4 system-ui,sans-serif}button,select{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:#1a253b;min-height:44px;cursor:pointer}button:hover:not(:disabled){background:#273650;border-color:var(--gold)}button:disabled{cursor:default;color:#9ba6be;border-color:#52617c;background:#192237}button:focus-visible,select:focus-visible{outline:3px solid #a9d5ff;outline-offset:3px}button[aria-selected=true]{background:#2d3041;border-color:var(--gold);color:var(--gold)}.review{padding:9px 24px;border-bottom:1px solid #39455e;display:flex;align-items:center;gap:16px;background:#11192a;font-size:12px;color:var(--muted)}.review label{margin-left:auto}.review select{min-height:32px;font-size:12px;padding:0 8px}.shell{max-width:1320px;margin:auto;padding:18px 32px 24px}.head{display:flex;align-items:center;gap:16px;margin-bottom:24px}.head h1{font:600 27px/1.2 Georgia,serif;margin:0;color:#f0ddaf}.head .wallet{margin-left:auto;display:flex;gap:20px}.icon{display:block;max-width:100%;height:auto;border:1px solid #57647d;border-radius:8px;padding:0;object-fit:contain}.small{width:30px}.medium{width:48px}.large{width:64px}.icon-button{display:flex;align-items:center;justify-content:center;padding:0;min-width:46px;min-height:46px;background:transparent;flex-shrink:0}.icon-button .icon{border:0;border-radius:9px;width:44px}.coin{display:flex;align-items:center;gap:9px;color:var(--gold);white-space:nowrap}.body{display:grid;grid-template-columns:214px minmax(0,1fr);gap:28px}.side{display:flex;flex-direction:column;gap:10px}.tab{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;min-height:64px}.tab .num{margin-left:auto;font-size:13px;color:var(--muted)}.side-note{margin-top:auto;padding:24px 12px;color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center}.content{min-width:0}.overview{display:flex;gap:24px;align-items:start;justify-content:space-between;padding:0 2px 18px;border-bottom:1px solid #39455d;margin-bottom:18px}.overview h2{font-size:22px;margin:0 0 5px}.sub{font-size:13px;color:var(--muted)}.stats{text-align:right}.stats strong{font-size:22px;color:var(--gold)}.rows{display:flex;flex-direction:column;gap:12px;max-height:405px;overflow-y:auto;padding:3px 6px 6px 3px;scrollbar-color:#67728b #10192a}.row{display:grid;grid-template-columns:50px minmax(0,1fr) 125px 100px 46px;gap:18px;align-items:center;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:112px}.row.ready{border-color:#b8a376;background:linear-gradient(100deg,#2a2a37,#192238)}.row.claimed{background:#14272a;border-color:#496965}.row h3{font-size:17px;margin:0 0 5px;font-weight:600}.row p{font-size:13px;color:var(--muted);margin:0}.progress{display:flex;flex-direction:column;gap:7px}.progress .value{font-size:14px;display:flex;justify-content:space-between}.track{height:7px;border:1px solid #65718a;border-radius:8px;background:#0b1221;overflow:hidden}.fill{height:100%;background:var(--gold)}.claimed .fill{background:#a6cdb8}.reward{justify-content:flex-end;font-weight:600;font-size:18px}.state-check{width:46px;display:flex;justify-content:center}.state-check .icon{width:34px}.claim{border-color:var(--gold);background:#51432f}.claim:hover:not(:disabled){background:#69583b}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 2px 0;margin-top:8px;border-top:1px solid #39455d}.claim-all{display:flex;gap:10px;align-items:center;padding:8px 18px;border-color:var(--gold);background:#51432f;color:#f3dfb4}.claim-all .icon{width:30px;border:0}.notice{color:#f2c3b9;background:#32242b;border:1px solid #9f787c;border-radius:9px;padding:10px 14px;margin-bottom:12px;font-size:13px}.empty{min-height:330px;display:grid;place-content:center;justify-items:center;gap:12px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);border:1px solid #8f997d;border-radius:10px;padding:12px 20px;background:#172d28;box-shadow:0 8px 40px #0006;color:#d1edd8;font-size:14px}.achievement .row{grid-template-columns:50px minmax(0,1fr) 105px 100px 46px;min-height:104px}.achievement .rows{max-height:405px}.auto{color:var(--green);font-size:13px}@media(max-width:950px){.shell{padding:16px 20px}.body{grid-template-columns:180px minmax(0,1fr);gap:16px}.tab{font-size:14px;padding:10px;gap:8px}.tab .small{width:26px}.row,.achievement .row{grid-template-columns:42px minmax(0,1fr) 88px 46px;gap:12px;padding:14px}.row>.progress{grid-column:2;grid-row:2}.row>.reward{grid-column:3;grid-row:1 / span 2}.row>.action{grid-column:4;grid-row:1 / span 2}.row>.type{grid-row:1 / span 2}.row h3{font-size:16px}.row .medium{width:40px}.rows,.achievement .rows{max-height:385px}.head{margin-bottom:18px}}@media(max-width:650px){.review{flex-wrap:wrap;padding:8px 14px;gap:4px}.review label{margin-left:0}.shell{padding:14px}.head h1{font-size:22px}.head .wallet{gap:10px;font-size:13px}.head .wallet .coin:last-child{display:none}.body{display:flex;flex-direction:column;gap:16px}.side{flex-direction:row;gap:7px}.tab{flex:1;min-height:54px;justify-content:center;gap:5px;font-size:12px;padding:6px}.tab .icon,.side-note{display:none}.tab .num{margin:0}.overview h2{font-size:19px}.row,.achievement .row{grid-template-columns:34px minmax(0,1fr) 65px 42px;gap:10px;padding:12px}.row .medium{width:32px}.reward{gap:5px;font-size:16px}.reward .small{width:24px}.row p{font-size:12px}.row h3{font-size:15px}.icon-button{min-width:42px;min-height:42px}.icon-button .icon{width:40px}.rows,.achievement .rows{max-height:430px}.footer{align-items:stretch;flex-direction:column}.claim-all{justify-content:center}.stats strong{font-size:20px}}
</style>
<div class="review"><span>Bản đề xuất • Dữ liệu minh họa • Không kết nối tài khoản</span><label for="scenario">Trạng thái xem trước</label><select id="scenario"><option value="normal">Có thưởng chờ nhận</option><option value="offline">Ngoại tuyến</option><option value="pending">Đang nhận thưởng</option><option value="error">Nhận thưởng thất bại</option><option value="done">Đã nhận toàn bộ</option><option value="empty">Không có nhiệm vụ</option></select><button id="reset" aria-label="Đặt lại dữ liệu minh họa" style="min-height:32px;padding:0 10px;font-size:12px">Đặt lại</button></div>
<div class="shell"><header class="head"><button class="icon-button" aria-label="Trở về màn hình chính" id="back"></button><h1>Nhiệm vụ</h1><div class="wallet"><span class="coin" id="jade"></span><span class="coin" id="star"></span></div></header><div class="body"><nav class="side" aria-label="Nhóm nhiệm vụ" role="tablist"></nav><main class="content" role="tabpanel" id="panel"></main></div></div><div id="toast" role="status" hidden></div>
<script>
const missions=[{"id":"m_daily_run","name":"Luyện tập mỗi ngày","text":"Hoàn thành 1 lượt chơi.","period":"daily","goal":{"type":"runsFinished","count":1},"reward":{"moonJade":20}},{"id":"m_daily_floors","name":"Leo tầng","text":"Đạt tổng cộng 10 tầng trong ngày.","period":"daily","goal":{"type":"floorsReached","count":10},"reward":{"moonJade":20}},{"id":"m_daily_heroes","name":"Đồng môn","text":"Dùng 3 Hero khác nhau trong ngày.","period":"daily","goal":{"type":"distinctHeroesUsed","count":3},"reward":{"moonJade":10}},{"id":"m_weekly_wins","name":"Khải hoàn","text":"Thắng 3 lượt chơi trong tuần.","period":"weekly","goal":{"type":"runsWon","count":3},"reward":{"moonJade":80}},{"id":"m_weekly_bosses","name":"Trấn Nguyệt","text":"Hạ boss 2 lần trong tuần.","period":"weekly","goal":{"type":"bossKills","count":2},"reward":{"moonJade":60}},{"id":"m_weekly_pulls","name":"Cầu duyên","text":"Quay 10 lượt trong tuần.","period":"weekly","goal":{"type":"gachaPulls","count":10},"reward":{"moonJade":40}}], achievements=[{"id":"a_first_win","name":"Lần đầu khải hoàn","text":"Thắng lượt chơi đầu tiên.","goal":{"type":"runsWon","count":1},"reward":{"moonJade":150}},{"id":"a_bond_bang_hoa","name":"Băng Hỏa đồng tâm","text":"Hạ boss với đội có Hoắc Liệt và Tần Sương.","goal":{"type":"bossKillWithBond","bondCardId":"bond_bang_hoa_tranh_phong"},"reward":{"moonJade":100}},{"id":"a_bond_anh_dau","name":"Ảnh Đấu song hành","text":"Hạ boss với đội có Tô Dạ và Diệp Linh Lung.","goal":{"type":"bossKillWithBond","bondCardId":"bond_anh_dau"},"reward":{"moonJade":100}},{"id":"a_bond_tuyet_trung","name":"Tuyết trung tống thán","text":"Hạ boss với đội có Tần Sương và Ôn Như Ý.","goal":{"type":"bossKillWithBond","bondCardId":"bond_tuyet_trung_tong_than"},"reward":{"moonJade":100}},{"id":"a_mastery_max","name":"Tu Luyện viên mãn","text":"Một Hero đạt Tu Luyện cấp 6.","goal":{"type":"masteryLevel","level":6},"reward":{"moonJade":150}},{"id":"a_all_heroes","name":"Tụ hội Thư Viện","text":"Sở hữu toàn bộ 20 Hero.","goal":{"type":"ownAllHeroes"},"reward":{"moonJade":250}},{"id":"a_starter_floor_8","name":"Bộ cơ bản cũng đủ","text":"Đạt tầng 8 với Bộ cơ bản.","goal":{"type":"starterFloor","floor":8},"reward":{"moonJade":100}},{"id":"a_all_unlocked","name":"Tàng Thư đầy đủ","text":"Mở hết lá khóa của mọi Hero đang sở hữu.","goal":{"type":"allLockedUnlocked"},"reward":{"moonJade":250}}];
const path='../../apps/client/public/assets/ui/';
const img=(name,size='small',alt='')=>'<img class="icon '+size+'" src="'+path+name+'.webp" alt="'+alt+'">';
const labels={daily:'Hằng ngày',weekly:'Hằng tuần',achievements:'Thành tựu'},icons={daily:'moon_full',weekly:'nav_history',achievements:'star'};
const taskIcons=['mode_run','mode_run','nav_heroes','mode_run','node_boss','nav_banners'];
const achieved=[true,false,false,false,false,false,false,false];
const numbers=[1,10,2,3,2,4]; let claimed=new Set(),tab='daily',scenario='normal',balance=2400,toastTimer;
const status=m=>claimed.has(m.id)?'claimed':numbers[missions.indexOf(m)]>=m.goal.count?'ready':'inprogress';
const tell=text=>{const e=document.querySelector('#toast');e.className='toast';e.textContent=text;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3000)};
const render=()=>{
const offline=scenario==='offline',busy=scenario==='pending';
document.querySelector('#back').innerHTML=img('nav_back');document.querySelector('#back').onclick=()=>tell('Bản đề xuất: trở về màn hình chính');
document.querySelector('#jade').innerHTML=img('cur_moonJade','small','Nguyệt Ngọc')+balance.toLocaleString('vi-VN');document.querySelector('#star').innerHTML=img('cur_moonStar','small','Nguyệt Tinh')+'120';
document.querySelector('.side').innerHTML=Object.keys(labels).map(k=>'<button class="tab" role="tab" aria-selected="'+(k===tab)+'" aria-controls="panel" data-tab="'+k+'">'+img(icons[k])+labels[k]+'<span class="num">'+(scenario==='empty'?(k==='achievements'?'0 / 0':'') :k==='achievements'?'1 / 8':missions.filter(m=>m.period===k&&status(m)==='ready').length||'')+'</span></button>').join('');
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();document.querySelector('[data-tab="'+tab+'"]').focus()});
let items=missions.filter(m=>m.period===tab);const ready=items.filter(m=>status(m)==='ready'),sum=ready.reduce((n,m)=>n+m.reward.moonJade,0),total=items.reduce((n,m)=>n+m.reward.moonJade,0),done=items.filter(m=>numbers[missions.indexOf(m)]>=m.goal.count).length;
let notice=offline?'Đang ngoại tuyến. Kết nối để cập nhật tiến độ và nhận thưởng.':busy?'Đang nhận thưởng…':scenario==='error'?'Chưa nhận được thưởng. Tiến độ được giữ nguyên; bạn có thể thử lại.':'';
let content='<section class="overview"><div><h2>'+labels[tab]+'</h2><div class="sub">'+(tab==='achievements'?'Tự nhận thưởng khi đạt • Không làm mới':tab==='daily'?'Làm mới lúc 04:00 mỗi ngày • Giờ Việt Nam':'Làm mới lúc 04:00 thứ Hai • Giờ Việt Nam')+'</div></div><div class="stats"><strong>'+(scenario==='empty'?'0 / 0':tab==='achievements'?'1 / 8':done+' / '+items.length)+'</strong><div class="sub">'+(tab==='achievements'?'Thành tựu đã đạt':'Nhiệm vụ hoàn thành')+'</div></div></section>'+(notice?'<div class="notice" role="status">'+notice+'</div>':'');
if(scenario==='empty')content+='<div class="empty">'+img('seal','large')+'<span>'+ (tab==='achievements'?'Chưa có thành tựu trong nhóm này.':'Chưa có nhiệm vụ trong kỳ này.')+'</span></div>';
else if(tab==='achievements'){
content+='<div class="rows">'+achievements.map((a,i)=>{const done=achieved[i];const ai=i===0?'mode_run':i<4?'node_boss':i===4?'nav_mastery':i===5?'nav_heroes':i===6?'mode_run':'seal';const p=i===4?'3 / 6':i===5?'3 / 20':i===6?'5 / 8':i===7?'6 / 12':'';
return '<article class="row '+(done?'claimed':'')+'"><div class="type">'+img(ai,'medium')+'</div><div><h3>'+a.name+'</h3><p>'+a.text+'</p></div><div class="progress"><span class="sub">'+(done?'Đã đạt':p||'Chưa đạt')+'</span></div><div class="reward coin">'+img('cur_moonJade','small','Nguyệt Ngọc')+a.reward.moonJade+'</div><div class="action state-check" aria-label="'+(done?'Đã tự nhận thưởng':'Chưa đạt')+'">'+img(done?'check':'lock')+'</div></article>'}).join('')+'</div>';
}else{
items.sort((a,b)=>['ready','inprogress','claimed'].indexOf(status(a))-['ready','inprogress','claimed'].indexOf(status(b)));
content+='<div class="rows">'+items.map(m=>{const s=status(m),i=missions.indexOf(m),p=Math.min(numbers[i],m.goal.count);const label=s==='ready'?'Nhận '+m.reward.moonJade+' Nguyệt Ngọc từ nhiệm vụ '+m.name:m.goal.type==='gachaPulls'?'Đến Cầu Duyên':m.goal.type==='distinctHeroesUsed'?'Đến danh sách Hero':'Đến chọn đội hình cho lượt chơi';
return '<article class="row '+s+'"><div class="type">'+img(taskIcons[i],'medium')+'</div><div><h3>'+m.name+'</h3><p>'+m.text+'</p></div><div class="progress"><span class="value">'+p+' / '+m.goal.count+(s==='claimed'?'<span class="sub">Đã nhận</span>':'')+'</span><div class="track" role="progressbar" aria-label="Tiến độ '+m.name+'" aria-valuenow="'+p+'" aria-valuemin="0" aria-valuemax="'+m.goal.count+'"><div class="fill" style="width:'+p/m.goal.count*100+'%"></div></div></div><div class="reward coin">'+img('cur_moonJade','small','Nguyệt Ngọc')+m.reward.moonJade+'</div><div class="action">'+(s==='claimed'?'<span class="state-check" aria-label="Đã nhận thưởng">'+img('check')+'</span>':'<button class="icon-button '+(s==='ready'?'claim':'')+'" data-id="'+m.id+'" aria-label="'+label+'" '+(s==='ready'&&(offline||busy)?'disabled':'')+'>'+img(s==='ready'?'node_treasure':taskIcons[i])+'</button>')+'</div></article>'}).join('')+'</div><footer class="footer"><span class="sub">Tổng thưởng trong kỳ: '+total+' Nguyệt Ngọc</span>'+(ready.length>=2?'<button class="claim-all" id="all" aria-label="Nhận tất cả '+ready.length+' nhiệm vụ đã hoàn thành, '+sum+' Nguyệt Ngọc" '+(offline||busy?'disabled':'')+'>'+img('node_treasure')+'<span>Nhận tất cả</span>'+img('cur_moonJade','small')+'<strong>'+sum+'</strong></button>':ready.length===1?'<span class="sub">1 nhiệm vụ có thể nhận thưởng</span>':'<span class="auto">'+(claimed.size?'Đã nhận mọi thưởng đã mở':'Tiếp tục hành trình để mở thưởng')+'</span>')+'</footer>';
}
document.querySelector('#panel').className='content '+(tab==='achievements'?'achievement':'');document.querySelector('#panel').innerHTML=content;
document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const m=missions.find(m=>m.id===b.dataset.id);if(status(m)==='ready'){if(scenario==='error'){tell('Bản đề xuất: nhận thưởng thất bại, có thể thử lại');return}claimed.add(m.id);balance+=m.reward.moonJade;render();document.querySelector('.claim, [data-tab="'+tab+'"]').focus();tell('+'+m.reward.moonJade+' Nguyệt Ngọc')}else tell('Bản đề xuất: '+b.getAttribute('aria-label'))});
const all=document.querySelector('#all');if(all)all.onclick=()=>{if(scenario==='error'){tell('Bản đề xuất: nhận thưởng thất bại, có thể thử lại');return}ready.forEach(m=>claimed.add(m.id));balance+=sum;render();document.querySelector('[data-tab="'+tab+'"]').focus();tell('+'+sum+' Nguyệt Ngọc')};
};
document.querySelector('#scenario').onchange=e=>{scenario=e.target.value;numbers.splice(0,6,1,10,2,3,2,4);claimed=new Set();balance=2400;if(scenario==='done'){missions.forEach((m,i)=>{numbers[i]=m.goal.count;claimed.add(m.id)})}render()};
document.querySelector('#reset').onclick=()=>{numbers.splice(0,6,1,10,2,3,2,4);claimed=new Set();scenario='normal';balance=2400;document.querySelector('#scenario').value='normal';render()};render();
</script></html>

<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đề xuất Tu Luyện · Vọng Nguyệt</title><link rel="stylesheet" href="mockup.css"></head>
<body><aside class="review"><span>Bản đề xuất · Dữ liệu minh họa · Không gọi máy chủ</span><label>Trạng thái <select id="scenario" aria-label="Trạng thái minh họa"><option value="ready">Có lượt mở</option><option value="none">Hết lượt mở</option><option value="complete">Đã mở toàn bộ</option><option value="maxPending">Cấp tối đa, còn lượt mở</option><option value="offline">Ngoại tuyến</option><option value="pending">Đang mở khóa</option><option value="error">Lỗi mở khóa</option><option value="empty">Không có Hero</option></select></label><button id="many" aria-pressed="false">20 Hero</button></aside>
<section class="game" aria-label="Tu Luyện"><header class="header"><button class="icon" id="back" aria-label="Trở về màn hình chính"><img src="../../apps/client/public/assets/ui/nav_back.webp" alt=""></button><h1>Tu Luyện</h1><div class="wallet"><img src="../../apps/client/public/assets/ui/cur_moonJade.webp" alt="Nguyệt Ngọc">2.400 <img src="../../apps/client/public/assets/ui/cur_moonStar.webp" alt="Nguyệt Tinh">0</div></header><div class="layout"><nav class="roster" aria-label="Chọn Hero"><h2>Hero của bạn</h2><div id="heroes" tabindex="0" aria-label="Danh sách Hero"></div></nav><main id="main"></main><aside class="details" aria-label="Chi tiết lá bài" id="details"></aside></div><p id="receipt" role="status" aria-live="polite"></p></section>
<dialog id="confirm" aria-labelledby="confirm-title"><form method="dialog"><header><h2 id="confirm-title">Mở lá khóa</h2><button class="icon" value="cancel" aria-label="Đóng xác nhận"><img src="../../apps/client/public/assets/ui/action_close.webp" alt=""></button></header><div id="confirmation"></div><footer><button value="cancel">Hủy</button><button class="primary" id="confirm-unlock" value="unlock">Mở khóa</button></footer></form></dialog>
<script src="mockup.js"></script></body></html>

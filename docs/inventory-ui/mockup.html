:root{color-scheme:dark;--ink:#101a2e;--panel:#142039;--text:#eee9db;--muted:#aab7cc;--line:#425370;--gold:#f0d181;--focus:#d2e6ff;--green:#a3d7b5}*{box-sizing:border-box}body{margin:0;background:#090f21;color:var(--text);font:14px 'Segoe UI',sans-serif}body:before{content:'';position:fixed;inset:0;background:linear-gradient(90deg,#0b1428ee,#101b30cf),url('/apps/client/public/assets/backgrounds/home.webp') center/cover;z-index:-1}button,input,select{font:inherit}button{cursor:pointer;color:inherit;background:#20314d;border:1px solid var(--line);border-radius:6px;padding:8px 12px;min-height:34px}button:hover{background:#304663}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:3px}button:disabled{cursor:default;opacity:.5}button.active{background:#354c66;border-color:var(--focus)}button.primary{background:#c29f4f;color:#161725;border-color:#f0d181;font-weight:600}button.primary:hover{background:#e1bd67}button.icon{padding:2px 10px;font-size:20px}input,select{background:#16243d;color:var(--text);border:1px solid #5f7390;border-radius:6px;padding:8px 10px;height:36px;min-width:0}img{display:block}.shell{max-width:1280px;margin:auto;padding:18px 24px 10px;height:720px;display:flex;flex-direction:column;gap:14px}.top{display:flex;align-items:center;gap:22px;height:48px}.title{flex:1}.title h1{font-size:26px;margin:0 0 3px;font-weight:500}.muted{color:var(--muted)}.title small{font-size:12px}.resources{display:flex;gap:20px}.resource{display:flex;align-items:center;gap:8px}.resource img{width:27px;height:27px;object-fit:contain}.resource small{display:block;font-size:11px;color:var(--muted)}.workspace{display:grid;grid-template-columns:612px 1fr;gap:20px;flex:1;min-height:0}.collection{display:flex;flex-direction:column;gap:10px;min-height:0}.categories{display:flex;gap:8px}.categories button{flex:1;text-align:left;padding:10px 14px;font-size:15px;display:flex;justify-content:space-between}.categories span{font-size gin:0 0 6px}.detail-header h2{margin:0 0 8px;font-size:25px;font-weight:500}.status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.status strong{color:var(--text);font-weight:500}.tabs{display:flex;margin:0 18px;border-bottom:1px solid var(--line);gap:12px}.tabs button{border:0;border-radius:0;background:none;flex:1;padding:9px 4px;color:var(--muted)}.tabs button.active{color:var(--text);border-bottom:2px solid var(--focus)}.detail-body{display:grid;grid-template-columns:188px 1fr;gap:16px;flex:1;min-height:0;padding:14px 18px 10px}.art-column{display:flex;flex-direction:column;min-width:0}.large-art{width:188px;height:282px;object-fit:contain;background:#0c1628;border:1px solid #455570;border-radius:8px}.art-column button{margin-top:8px;font-size:12px}.connection{margin-top:10px;color:var(--muted);font-size:12px;line-height:18px}.connection img{display:inline-block;vertical-align:middle;width:24px;height:24px;object-fit:cover;border-radius:50%;margin-right:6px}.info{overflow:auto;scrollbar-width:thin;scrollbar-color:#bdcee3 #25344e;padding-right:8px}.section-label{margin:0 0 7px;color:var(--muted);font-size:11px;letter-spacing:.4px}.info h3{font-size:16px;color:var(--gold);margin:0 0 8px;font-weight:500}.info p{line-height:21px;margin:0 0 13px}.info .effect{background:#1c2d43;border:1px solid #475b77;padding:12px;border-radius:7px;margin-bottom:14px}.next{border-left:2px solid #bad6ef;padding:0 0 0 10px;color:#cedef2;font-size:13px}.level-selector{display:flex;gap:6px;margin:0 0 14px}.level-selector button{width:31px;min-height:31px;padding:3px;border-radius:50%;font-size:12px}.preview-note{color:#e0bd7d;font-size:12px;line-height:18px;margin-bottom:12px}.milestone{padding:9px 10px;border:1px solid var(--line);border-radius:6px;margin:7px 0;line-height:20px;color:var(--muted);font-size:13px}.milestone.reached{color:#ecdfb9;border-color:#6b6654}.milestone.current{background:#25374e;border-color:#b6cfec;color:var(--text)}.usage-card{padding:12px;border:1px solid #4e647e;border-radius:7px;margin-bottom:10px}.usage-card p{font-size:13px;margin:7px 0 0;color:var(--muted)}.action-footer{padding:12px 18px 14px;background:#14243b;border-top:1px solid var(--line)}.cost{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}.cost img{height:24px;width:24px;object-fit:contain}.cost strong{margin-left:auto;color:var(--green);font-size:15px}.actions{display:flex;gap:10px}.actions button{min-height:42px}.actions .primary{flex:1}.reason{font-size:12px;color:var(--muted);margin-top:7px}.demo-note{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}.demo-note a{color:#c5dbf1}dialog{background:#15223a;color:var(--text);border:1px solid #6d82a1;border-radius:12px;max-width:610px;padding:24px}dialog::backdrop{background:#000b}dialog h2{font-size:22px;margin-top:0}dialog p{line-height:22px}dialog img.full{max-height:70vh;max-width:70vw;object-fit:contain}dialog button{float:right}.art-dialog{padding:12px}dialog .notice{font-size:12px;color:var(--muted)}.danger{color:#f1a6a6!important}

</style></head><body><main class="shell"><header class="top"><button id="back">‹ Quay lại</button><div class="title"><h1>Kho đồ</h1><small class="muted">Binh Khí & Nguyệt Bảo</small></div><div class="resources"><div class="resource"><img src="/apps/client/public/assets/ui/cur_darkIron.webp" alt=""><div><small>Huyền Thiết</small><span id="iron"></span></div></div><div class="resource"><img src="/apps/client/public/assets/ui/cur_moonDust.webp" alt=""><div><small>Nguyệt Trần</small><span id="dust"></span></div></div></div></header><section class="workspace"><section class="collection"><nav class="categories" aria-label="Loại trang bị"><button data-kind="weapons"></button><button data-kind="relics"></button></nav><div class="tools"><input id="search" type="search" aria-label="Tìm trang bị" placeholder="Tìm tên trang bị…"><select id="rarity" aria-label="Độ hiếm"><option value="all">Mọi độ hiếm</option><option value="legendary">Truyền thuyết</option><option value="epic">Sử thi</option><option value="rare">Hiếm</option><option value="common">Thường</option></select><select id="sort" aria-label="Sắp xếp"><option value="owned">Sở hữu trước</option><option value="rarity">Độ hiếm</option><option value="level">Cấp cao trước</option><option value="name">Tên A–Z</option></select></div><div class="ownership" aria-label="Lọc trang bị"><button data-own="all">Tất cả</button><button data-own="owned">Đã sở hữu</button><button data-own="upgrade">Nâng cấp được</button><button data-own="locked">Chưa sở hữu</button></div><div id="grid" class="grid"></div><footer class="collection-footer"><small id="count"></small><div id="pages" class="pages"></div><button id="reset">Xóa lọc</button></footer></section><aside id="details" class="details" aria-label="Chi tiết trang bị"></aside></section><footer class="demo-note"><span>BẢN ĐỀ XUẤT · Hồ sơ / bộ bài minh họa · Không kết nối API hoặc tiêu nguyên liệu</span><a href="proposal.md">Đọc review và hướng triển khai</a></footer></main><dialog id="dialog"></dialog>
<script type="module">
const root='/packages/data/';
const [weapons,relics,heroes,economy]=await Promise.all(['weapons.json','relics.json','heroes.json','economy-config.json'].map(file=>fetch(root+file).then(r=>r.json())));
const data={weapons,relics}, heroNames=Object.fromEntries(heroes.map(h=>[h.id,h.name]));
// Illustration only: definitions and upgrade prices come from repository JSON.
const owned={w_xich_diem_thuong:3,w_anh_nguyet_chuy:2,w_thiet_thuan:1,w_han_mon_kiem:5,r_thien_sach:1,r_vong_nguyet_kinh:2,r_huyen_vu_giap_phu:5};
const material={darkIron:96,moonDust:18}, rarityName={legendary:'Truyền thuyết',epic:'Sử thi',rare:'Hiếm',common:'Thường'}, rarityRank={legendary:3,epic:2,rare:1,common:0}, rarityColor={legendary:'#f0d181',epic:'#cbaff2',rare:'#9fc8ff',common:'#c4cedd'};
const roles={vanguard:'Tiên phong',striker:'Tấn công',controller:'Khống chế',support:'Hỗ trợ',specialist:'Chuyên biệt'};
const state={kind:'weapons',selected:'w_xich_diem_thuong',query:'',rarity:'all',sort:'owned',ownership:'all',page:0,tab:'effect',preview:3};
const $=s=>document.querySelector(s), norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=()=>state.kind==='weapons'?'Tinh Luyện':'Cộng Minh', kind=()=>state.kind==='weapons'?'weapon':'relic', matId=()=>state.kind==='weapons'?'darkIron':'moonDust', matName=()=>state.kind==='weapons'?'Huyền Thiết':'Nguyệt Trần', art=d=>`/apps/client/public/assets/${state.kind}/${d.id}.png`;
function cost(d){const level=owned[d.id];return level?economy.upgradeCost[kind()][d.rarity==='common'?'rare':d.rarity][level-1]??null:null}
function canUpgrade(d){const price=cost(d);return price!==null&&material[matId()]>=price}
function cardAt(d,level){return d.refinement.slice(0,level-1).reduce((card,change)=>({...card,...change.card}),{...d.card})}
function passiveAt(d,level){return d.refinement.slice(0,level-1).reduce((text,change)=>(change.hooks||change.signatureHooks)?change.text:text,d.text)}
function effectAt(d,level){if(state.kind==='relics')return d.resonance[level-1].text;const card=cardAt(d,level);return `${card.name} · ${card.cost} Nguyệt Lực · ${card.copies} bản\n${card.text}`}
function filtered(){return data[state.kind].filter(d=>norm(d.name).includes(norm(state.query))&&(state.rarity==='all'||d.rarity===state.rarity)&&(state.ownership==='all'||state.ownership==='owned'&&owned[d.id]||state.ownership==='locked'&&!owned[d.id]||state.ownership==='upgrade'&&canUpgrade(d))).sort((a,b)=>state.sort==='owned'?Number(!!owned[b.id])-Number(!!owned[a.id]):state.sort==='rarity'?rarityRank[b.rarity]-rarityRank[a.rarity]:state.sort==='level'?(owned[b.id]??0)-(owned[a.id]??0):a.name.localeCompare(b.name,'vi'))}
function reset(){state.query='';state.rarity='all';state.ownership='all';state.sort='owned';state.page=0;$('#search').value='';$('#rarity').value='all';$('#sort').value='owned';render()}
function render(){
 $('#iron').textContent=material.darkIron;$('#dust').textContent=material.moonDust;
 document.querySelectorAll('[data-kind]').forEach(b=>{const k=b.dataset.kind;b.classList.toggle('active',k===state.kind);b.setAttribute('aria-pressed',k===state.kind);b.innerHTML=`${k==='weapons'?'Binh Khí':'Nguyệt Bảo'} <span>${data[k].filter(d=>owned[d.id]).length}/${data[k].length} sở hữu</span>`});
 document.querySelectorAll('[data-own]').forEach(b=>{b.classList.toggle('active',b.dataset.own===state.ownership);b.setAttribute('aria-pressed',b.dataset.own===state.ownership)});
 const list=filtered(),pages=Math.max(1,Math.ceil(list.length/12));state.page=Math.min(state.page,pages-1);$('#count').textContent=`${list.length} ${state.kind==='weapons'?'Binh Khí':'Nguyệt Bảo'} · Trang ${state.page+1}/${pages}`;
 $('#grid').innerHTML=list.length?list.slice(state.page*12,state.page*12+12).map(d=>{const level=owned[d.id];return `<button class="tile ${d.id===state.selected?'selected':''} ${!level?'locked':''} ${level===5?'max':''}" data-item="${d.id}" aria-label="${esc(d.name)} · ${level?tag()+' '+level:'Chưa sở hữu'}"><img class="art" src="${art(d)}" alt=""><i class="rarity-dot" style="background:${rarityColor[d.rarity]}" title="${rarityName[d.rarity]}"></i>${level===5?'<span class="badge">Tối đa</span>':!level?'<span class="badge">Chưa có</span>':canUpgrade(d)?'<span class="badge">↑ Nâng được</span>':''}<span class="name">${esc(d.name)}</span><span class="progress">${level?tag()+' '+level+'/5':'Chưa sở hữu'}</span></button>`}).join(''):'<div class="empty"><strong>Không tìm thấy trang bị phù hợp</strong><span>Thử tên khác hoặc bỏ bộ lọc</span><button id="clear-empty">Xóa bộ lọc</button></div>';
 document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.item;state.preview=owned[state.selected]??1;render()});$('#clear-empty')?.addEventListener('click',reset);
 $('#pages').innerHTML=`<button data-page="${state.page-1}" ${state.page===0?'disabled':''} aria-label="Trang trước">‹</button>${Array.from({length:pages},(_,i)=>`<button class="${i===state.page?'active':''}" data-page="${i}">${i+1}</button>`).join('')}<button data-page="${state.page+1}" ${state.page===pages-1?'disabled':''} aria-label="Trang sau">›</button>`;
 document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=Number(b.dataset.page);render()});$('#reset').disabled=!state.query&&state.rarity==='all'&&state.ownership==='all'&&state.sort==='owned';
 renderDetails(list);
}
function renderDetails(list){
 const d=data[state.kind].find(d=>d.id===state.selected),level=owned[d.id],shown=state.preview,price=cost(d),isWeapon=state.kind==='weapons';
 const relation=isWeapon?(d.signatureHeroId?`Bản mệnh: ${heroNames[d.signatureHeroId]}`:`Vũ khí chung · ${roles[d.archetype]??''}`):'Mang tối đa 2 Nguyệt Bảo trong mỗi bộ bài';
 const current=isWeapon?effectAt(d,shown):d.resonance[shown-1].text;
 const milestones=isWeapon?[`Lá: ${d.card.text}\nNội tại: ${d.text}`,...d.refinement.map(l=>l.text)]:d.resonance.map(l=>l.text);
 let info='';
 if(state.tab==='effect') info=`<div class="level-selector" aria-label="Xem cấp trang bị">${[1,2,3,4,5].map(n=>`<button data-level="${n}" class="${n===shown?'active':''}" title="Xem ${tag()} ${n}">${n}</button>`).join('')}</div>${shown!==(level??1)?`<div class="preview-note">Đang xem trước ${tag()} ${shown} · Cấp sở hữu giữ nguyên</div>`:''}<p class="section-label">${level?'HIỆU ỨNG Ở CẤP ĐANG XEM':'XEM TRƯỚC · CHƯA SỞ HỮU'}</p><h3>${isWeapon?esc(cardAt(d,shown).name):`${tag()} ${shown}`}</h3><div class="effect">${esc(current).replaceAll('\n','<br>')}</div>${isWeapon?`<p class="section-label">NỘI TẠI / BẢN MỆNH</p><p>${esc(passiveAt(d,shown))}</p><button id="view-card">Xem lá Binh Khí</button>`:''}${level&&level<5?`<div class="next"><p class="section-label">NÂNG ${level} → ${level+1}</p><p>${esc(milestones[level])}</p></div>`:level===5?'<p class="next">Đã đạt cấp tối đa</p>':''}`;
 else if(state.tab==='levels') info=`<p class="section-label">${isWeapon?'CÁC MỐC THAY ĐỔI TÍCH LŨY':'MỖI CẤP THAY THẾ TOÀN BỘ CẤP TRƯỚC'}</p>${milestones.map((text,i)=>`<div class="milestone ${level&&level>i?'reached':''} ${level===i+1?'current':''}"><strong>${level===i+1?'▶':level&&level>i?'✓':'○'} ${tag()} ${i+1}</strong><br>${esc(text).replaceAll('\n','<br>')}</div>`).join('')}`;
 else info=`<p class="section-label">BỘ BÀI MINH HỌA ĐANG DÙNG</p>${['w_xich_diem_thuong','r_thien_sach'].includes(d.id)?'<div class="usage-card"><strong>Đội Hoắc Liệt</strong><p>Tham chiếu trang bị từ cấu hình bộ bài</p><button id="edit-deck">Mở bộ bài</button></div>':'<p>Chưa được dùng trong bộ bài minh họa.</p>'}<p class="next">Chọn trang bị trong màn hình sửa bộ bài. Xem Kho đồ không tự thay cấu hình.</p>`;
 const available=price!==null&&material[matId()]>=price;
 $('#details').innerHTML=`<header class="detail-header"><p class="eyebrow">${rarityName[d.rarity]} · ${isWeapon?'BINH KHÍ':'NGUYỆT BẢO'}</p><h2>${esc(d.name)}</h2><div class="status"><strong>${level?tag()+' '+level+'/5':'Chưa sở hữu'}</strong><span>${list.some(x=>x.id===d.id)?'Đang xem': 'Nằm ngoài bộ lọc'}</span></div></header><nav class="tabs" aria-label="Nhóm thông tin">${[['effect','Hiệu ứng'],['levels','Các cấp'],['usage','Sử dụng']].map(([id,name])=>`<button data-tab="${id}" class="${id===state.tab?'active':''}">${name}</button>`).join('')}</nav><section class="detail-body"><div class="art-column"><img class="large-art" src="${art(d)}" alt="${esc(d.name)}"><button id="enlarge-art">Xem art lớn</button><div class="connection">${isWeapon&&d.signatureHeroId?`<img src="/apps/client/public/assets/heroes/${d.signatureHeroId}.webp" alt="">`:''}${esc(relation)}${isWeapon&&d.signatureHeroId?'<br>Nội tại mạnh hơn khi Hero bản mệnh mang.':''}</div></div><div class="info">${info}</div></section><footer class="action-footer"><div class="cost"><img src="/apps/client/public/assets/ui/cur_${matId()}.webp" alt=""><span>${level&&level<5?`Nâng ${level} → ${level+1} · ${matName()}`:level===5?'Đã đạt cấp tối đa':`Nguyên liệu nâng: ${matName()}`}</span><strong class="${price!==null&&!available?'danger':''}">${price!==null?`${material[matId()]} / ${price}`:'—'}</strong></div><div class="actions"><button id="upgrade" class="${level?'primary':''}" ${!available?'disabled':''}>Nâng Cấp</button><button id="summon" class="${!level?'primary':''}">Triệu Hồi</button></div><div class="reason">${!level?'Cần sở hữu trang bị trước khi nâng cấp.':level===5?'Đã hoàn thành 5 cấp.':!available?`Thiếu ${price-material[matId()]} ${matName()}.`:'Đủ nguyên liệu · Xem lợi ích cấp tiếp theo trước khi nâng.'}</div></footer>`;
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.preview=Number(b.dataset.level);render()});
 $('#enlarge-art').onclick=()=>modal(`<img class="full" src="${art(d)}" alt="${esc(d.name)}">`,true);
 $('#view-card')?.addEventListener('click',()=>modal(`<h2>${esc(cardAt(d,shown).name)}</h2><p>${esc(effectAt(d,shown)).replaceAll('\n','<br>')}</p><p class="notice">Lá ở ${tag()} ${shown}. Khi triển khai dùng renderer card hiện có.</p>`));
 $('#upgrade').onclick=()=>modal(`<h2>Xem trước nâng cấp</h2><p>${esc(d.name)} · ${tag()} ${level} → ${level+1}</p><p class="next">${esc(milestones[level])}</p><p>Chi phí: <strong>${price} ${matName()}</strong> · Còn ${material[matId()]-price}</p><p class="notice">Mockup chỉ minh họa cách trình bày. Không gọi API hoặc thay đổi hồ sơ.</p>`);
 $('#summon').onclick=()=>modal('<h2>Triệu Hồi</h2><p>Trong game, nút này mở màn Triệu Hồi hiện có.</p><p class="notice">Chọn món đồ trong Kho đồ không bảo đảm kết quả quay.</p>');
 $('#edit-deck')?.addEventListener('click',()=>modal('<h2>Mở bộ bài</h2><p>Trong game, mở bộ bài tương ứng để chọn trang bị theo cấu hình hiện có.</p>'));
}
function modal(html,art=false){const dialog=$('#dialog');dialog.classList.toggle('art-dialog',art);dialog.innerHTML=html+'<br><button id="close-dialog">Đóng</button>';$('#close-dialog').onclick=()=>dialog.close();dialog.showModal()}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{state.kind=b.dataset.kind;state.selected=state.kind==='weapons'?'w_xich_diem_thuong':'r_vong_nguyet_kinh';state.preview=owned[state.selected]??1;state.tab='effect';reset()});
document.querySelectorAll('[data-own]').forEach(b=>b.onclick=()=>{state.ownership=b.dataset.own;state.page=0;render()});$('#search').oninput=e=>{state.query=e.target.value;state.page=0;render()};$('#rarity').onchange=e=>{state.rarity=e.target.value;state.page=0;render()};$('#sort').onchange=e=>{state.sort=e.target.value;state.page=0;render()};$('#reset').onclick=reset;$('#back').onclick=()=>modal('<h2>Bản đề xuất Kho đồ</h2><p>Nút quay lại trong game giữ luồng trở về Home hiện có.</p>');render();
</script></body></html>

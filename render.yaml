# Render Blueprint — backend Vọng Nguyệt (`deploy/vercel-render.md`).
# Database lives in Supabase Postgres (DATABASE_URL) — no disk needed on Render,
# data survives redeploys on the free plan. Backups: Supabase managed backups
# (Dashboard → Database → Backups); a local pg_dump schedule only runs when
# BACKUP_DIR is set, which this Blueprint intentionally leaves off.
services:
  - type: web
    name: vong-nguyet
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node apps/server/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Supabase production project: Dashboard → Connect → Transaction pooler
      # (port 6543). Paste the full connection string with the real password.
      - key: DATABASE_URL
        sync: false
      # Fill with the Vercel domain after deploying the client, e.g.
      # https://vong-nguyet.vercel.app — the server refuses other origins.
      - key: ALLOWED_ORIGINS
        sync: false
